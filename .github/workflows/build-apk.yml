name: Build JEWAR APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK Environment
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          yes | sdkmanager --licenses || true

      - name: Install dependencies
        run: npm ci

      - name: Run calculation tests
        run: npm test

      - name: Sync web app into Android project
        run: npx cap sync android

      - name: Check signing secrets
        env:
          KS_B64: ${{ secrets.JEWAR_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.JEWAR_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::أسرار التوقيع غير موجودة. أضف JEWAR_KEYSTORE_BASE64 و JEWAR_KEYSTORE_PASSWORD (راجع README.md)."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/jewar.keystore"

      - name: Build signed release APK
        working-directory: android
        env:
          JEWAR_KEYSTORE_FILE: ${{ runner.temp }}/jewar.keystore
          JEWAR_KEYSTORE_PASSWORD: ${{ secrets.JEWAR_KEYSTORE_PASSWORD }}
          JEWAR_KEY_ALIAS: jewar
          JEWAR_KEY_PASSWORD: ${{ secrets.JEWAR_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PjewarVersionCode=${{ github.run_number }} \
            -PjewarVersionName=1.0.${{ github.run_number }}

      - name: Verify signature (fingerprint must be identical in every build)
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" | grep -i "SHA-256" || true
          cp "$APK" JEWAR.apk

      - uses: actions/upload-artifact@v4
        with:
          name: JEWAR-apk
          path: JEWAR.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: JEWAR 1.0.${{ github.run_number }}
          files: JEWAR.apk
